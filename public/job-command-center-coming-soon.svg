<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Job Command Center, coming soon</title>
  <desc id="d">A dashboard sketch with Applications, Resumes and Cover letters panels and a Coming soon label</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe5d3"/>
      <stop offset="1" stop-color="#ffab85"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#7a2e1a" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- window -->
  <rect x="150" y="110" width="1300" height="680" rx="28" fill="#ffffff" fill-opacity="0.45" stroke="#b4533a" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="205" cy="160" r="12" fill="#b4533a" fill-opacity="0.55"/>
  <circle cx="245" cy="160" r="12" fill="#b4533a" fill-opacity="0.4"/>
  <circle cx="285" cy="160" r="12" fill="#b4533a" fill-opacity="0.25"/>
  <text x="800" y="170" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#7a2e1a" fill-opacity="0.85">Job Command Center</text>
  <line x1="150" y1="205" x2="1450" y2="205" stroke="#b4533a" stroke-opacity="0.25" stroke-width="2"/>

  <!-- three panels -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <g>
      <rect x="205" y="250" width="380" height="330" rx="20" fill="#ffffff" fill-opacity="0.65" stroke="#b4533a" stroke-opacity="0.25" stroke-width="2"/>
      <text x="245" y="315" font-size="38" font-weight="600" fill="#7a2e1a">Applications</text>
      <rect x="245" y="355" width="300" height="16" rx="8" fill="#b4533a" fill-opacity="0.35"/>
      <rect x="245" y="395" width="240" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="245" y="435" width="270" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="245" y="500" width="130" height="44" rx="22" fill="#ff8a65"/>
    </g>
    <g>
      <rect x="610" y="250" width="380" height="330" rx="20" fill="#ffffff" fill-opacity="0.65" stroke="#b4533a" stroke-opacity="0.25" stroke-width="2"/>
      <text x="650" y="315" font-size="38" font-weight="600" fill="#7a2e1a">Resumes</text>
      <rect x="650" y="355" width="300" height="16" rx="8" fill="#b4533a" fill-opacity="0.35"/>
      <rect x="650" y="395" width="260" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="650" y="435" width="210" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="650" y="500" width="130" height="44" rx="22" fill="#ff8a65"/>
    </g>
    <g>
      <rect x="1015" y="250" width="380" height="330" rx="20" fill="#ffffff" fill-opacity="0.65" stroke="#b4533a" stroke-opacity="0.25" stroke-width="2"/>
      <text x="1055" y="315" font-size="38" font-weight="600" fill="#7a2e1a">Cover letters</text>
      <rect x="1055" y="355" width="300" height="16" rx="8" fill="#b4533a" fill-opacity="0.35"/>
      <rect x="1055" y="395" width="230" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="1055" y="435" width="280" height="16" rx="8" fill="#b4533a" fill-opacity="0.22"/>
      <rect x="1055" y="500" width="130" height="44" rx="22" fill="#ff8a65"/>
    </g>

    <!-- coming soon label -->
    <rect x="470" y="610" width="660" height="130" rx="65" fill="#7a2e1a"/>
    <text x="800" y="695" text-anchor="middle" font-size="68" font-weight="700" fill="#ffe3d3" letter-spacing="1">Coming soon</text>
  </g>
</svg>
